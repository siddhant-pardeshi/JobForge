<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Scam shield">
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c1a"/><stop offset="0.5" stop-color="#ff2e88"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <style>
    .bg4 { fill: #0a0a14; }
    .ttl4 { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #f5f3ef; }
    .sub4 { font-family: 'Inter', Arial, sans-serif; font-size: 14px; fill: #a8a3b5; }
    .panel4 { fill: #12121f; stroke: #ffffff22; }
    .flagb { animation: flagin 0.6s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes flagin { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
    .flagt { font-family: 'Inter', Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #f5f3ef; }
    .flaga { font-family: 'Inter', Arial, sans-serif; font-size: 11px; fill: #a8a3b5; }
    .shield { animation: shieldpulse 2.2s ease-in-out infinite; }
    @keyframes shieldpulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }
    .sc4 { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
    .warn { fill: #ffa2a2; font-family: 'Space Grotesk', Arial, sans-serif; font-weight: 700; }
    .counter { font-family: 'JetBrains Mono', monospace; fill: #ffb28a; }
    .counterN { animation: count 2.8s ease-in-out infinite alternate; }
    @keyframes count { from { content: "0"; } }
  </style>
  <rect class="bg4" width="1200" height="300"/>

  <text class="ttl4" x="60" y="56">Fraud, screened <tspan fill="url(#g4)">three ways.</tspan></text>
  <text class="sub4" x="60" y="84">Paste it, screen a full email, or check the open mail inside Gmail and Outlook with one click.</text>

  <!-- envelope -->
  <g transform="translate(60, 116)">
    <rect class="panel4" x="0" y="0" width="300" height="150" rx="12"/>
    <path d="M20 30 L150 105 L280 30" stroke="#5a5468" stroke-width="3" fill="none"/>
    <rect x="20" y="24" width="260" height="102" rx="6" fill="none" stroke="#5a5468" stroke-width="2"/>
    <text class="sub4" x="20" y="142">the open mail, nothing more</text>
  </g>

  <!-- shield -->
  <g transform="translate(430, 96)">
    <path class="shield" d="M60 6 L104 24 C104 76 84 104 60 116 C36 104 16 76 16 24 Z" fill="rgba(255,92,26,0.12)" stroke="url(#g4)" stroke-width="3"/>
    <text class="sc4" x="38" y="72" font-size="24" text-anchor="middle" fill="#ffb28a">23</text>
    <text class="sub4" x="14" y="138" font-family="Inter, Arial, sans-serif">indicators hunting</text>
  </g>

  <!-- verdict -->
  <g transform="translate(600, 96)">
    <rect class="flagb" x="0" y="0" width="540" height="52" rx="10" fill="rgba(251,77,77,0.1)" stroke="rgba(251,77,77,0.55)" style="animation-delay: 0.6s"/>
    <text class="flagt" x="20" y="24" fill="#ffa2a2">⚠ Asks for money</text>
    <text class="flaga" x="20" y="42">Registration fee of ₹499 via U P I. No employer ever charges you.</text>
    <rect class="flagb" x="0" y="62" width="540" height="52" rx="10" fill="rgba(255,255,255,0.04)" stroke="#ffffff22" style="animation-delay: 0.9s"/>
    <text class="flagt" x="20" y="86">Reply to differs from sender</text>
    <text class="flaga" x="20" y="104">Replies divert to another mailbox. A takeover trick.</text>
    <rect class="flagb" x="0" y="124" width="540" height="52" rx="10" fill="rgba(255,255,255,0.04)" stroke="#ffffff22" style="animation-delay: 1.2s"/>
    <text class="flagt" x="20" y="148">Link text says careers.tcs.com, href goes elsewhere</text>
    <text class="flaga" x="20" y="166">Never tap it. Type the company address yourself.</text>
  </g>

  <!-- counter strip -->
  <g transform="translate(600, 246)">
    <text class="counter" x="0" y="20" font-size="15">fee · U P I · OTP · reply to · sender domain · link lies · shorteners · urgency + money</text>
  </g>
</svg>
