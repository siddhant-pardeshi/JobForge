<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Scoring engine">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5c1a"/><stop offset="0.5" stop-color="#ff2e88"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <style>
    .bg3 { fill: #0a0a14; }
    .ttl3 { font-family: 'Space Grotesk', Arial, sans-serif; font-size: 26px; font-weight: 700; fill: #f5f3ef; }
    .sub3 { font-family: 'Inter', Arial, sans-serif; font-size: 14px; fill: #a8a3b5; }
    .lbl { font-family: 'Inter', Arial, sans-serif; font-size: 13.5px; fill: #d8d4e2; }
    .val { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 700; fill: #ffb28a; }
    .barbg3 { fill: rgba(255,255,255,0.07); }
    .barfill3 { fill: url(#g3); transform-box: fill-box; transform-origin: left center; animation: grow3 1.4s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes grow3 { from { transform: scaleX(0); } }
    .ringbg { stroke: rgba(255,255,255,0.09); }
    .ringarc { stroke: #34d399; stroke-linecap: round; stroke-dasharray: 408; stroke-dashoffset: 408; animation: draw 2s cubic-bezier(0.22,1,0.36,1) 0.5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 106; } }
    .num { font-family: 'JetBrains Mono', monospace; font-weight: 700; fill: #34d399; }
    .lane { font-family: 'Inter', Arial, sans-serif; font-size: 12.5px; font-weight: 600; }
  </style>
  <rect class="bg3" width="1200" height="300"/>

  <text class="ttl3" x="60" y="56">Seven components. <tspan fill="url(#g3)">Zero black boxes.</tspan></text>
  <text class="sub3" x="60" y="84">Open any card to argue with the score. Weights are yours to retune live.</text>

  <!-- score ring -->
  <g transform="translate(60, 108)">
    <circle cx="70" cy="70" r="65" class="ringbg" stroke-width="10" fill="none"/>
    <circle cx="70" cy="70" r="65" class="ringarc" stroke-width="10" fill="none"/>
    <text class="num" x="42" y="80" font-size="34">74</text>
  </g>

  <!-- component bars -->
  <g transform="translate(240, 104)">
    <text class="lbl" x="0" y="12">Demonstrated skill fit</text><text class="val" x="500" y="12" text-anchor="end">26/30</text>
    <rect class="barbg3" x="0" y="18" width="500" height="9" rx="4"/><rect class="barfill3" x="0" y="18" width="433" height="9" rx="4" style="animation-delay: 0.7s"/>
    <text class="lbl" x="0" y="52">Responsibility fit</text><text class="val" x="500" y="52" text-anchor="end">20/20</text>
    <rect class="barbg3" x="0" y="58" width="500" height="9" rx="4"/><rect class="barfill3" x="0" y="58" width="500" height="9" rx="4" style="animation-delay: 0.9s"/>
    <text class="lbl" x="0" y="92">Location fit · Pune</text><text class="val" x="500" y="92" text-anchor="end">15/15</text>
    <rect class="barbg3" x="0" y="98" width="500" height="9" rx="4"/><rect class="barfill3" x="0" y="98" width="500" height="9" rx="4" style="animation-delay: 1.1s"/>
    <text class="lbl" x="0" y="132">Experience · pay · evidence · freshness</text><text class="val" x="500" y="132" text-anchor="end">13/35</text>
    <rect class="barbg3" x="0" y="138" width="500" height="9" rx="4"/><rect class="barfill3" x="0" y="138" width="186" height="9" rx="4" style="animation-delay: 1.3s"/>
  </g>

  <!-- lanes -->
  <g font-family="Inter, Arial, sans-serif" transform="translate(850, 104)">
    <rect x="0" y="0" width="290" height="30" rx="15" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.45)"/>
    <text class="lane" x="20" y="20" fill="#8af0c8">Best in Pune</text>
    <rect x="0" y="40" width="290" height="30" rx="15" fill="rgba(34,211,238,0.08)" stroke="rgba(34,211,238,0.45)" style="animation-delay: 0.2s"/>
    <text class="lane" x="20" y="60" fill="#8ce8f7" style="animation-delay: 0.2s">Remote from Pune</text>
    <rect x="0" y="80" width="290" height="30" rx="15" fill="rgba(139,92,246,0.1)" stroke="rgba(139,92,246,0.5)" style="animation-delay: 0.4s"/>
    <text class="lane" x="20" y="100" fill="#c9b4ff" style="animation-delay: 0.4s">Relocation</text>
    <rect x="0" y="120" width="290" height="30" rx="15" fill="rgba(251,191,36,0.08)" stroke="rgba(251,191,36,0.5)" style="animation-delay: 0.6s"/>
    <text class="lane" x="20" y="140" fill="#ffd884" style="animation-delay: 0.6s">Needs verification</text>
    <rect x="0" y="160" width="290" height="30" rx="15" fill="rgba(251,77,77,0.09)" stroke="rgba(251,77,77,0.5)" style="animation-delay: 0.8s"/>
    <text class="lane" x="20" y="180" fill="#ffa2a2" style="animation-delay: 0.8s">Filtered out · reason shown</text>
  </g>
</svg>
